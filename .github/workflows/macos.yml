name: macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: Scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WiiBalanceScale-macOS
          path: macOS/build/WiiBalanceScale.zip
